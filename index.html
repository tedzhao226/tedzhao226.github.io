<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ted Zhao</title>
    <!--
      To point this site at your Notion page:
      1. Publish the Notion page (Share -> Publish) and copy its URL.
      2. Paste it as NOTION_URL below.
      3. git commit && git push  ->  tedzhao226.github.io redirects to Notion.
      Leave it empty and this stays a clean holding page.
    -->
    <script>
      var NOTION_URL = "";
      if (NOTION_URL) {
        document.write(
          '<meta http-equiv="refresh" content="0; url=' + NOTION_URL + '">',
        );
        location.replace(NOTION_URL);
      }
    </script>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 16px/1.6 system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      main { max-width: 32rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { opacity: 0.75; margin: 0; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <h1>Ted Zhao</h1>
      <p>This site is moving to Notion. Check back shortly.</p>
    </main>
  </body>
</html>
